<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Spelled exactly as the network checklists print it: uppercase DOCTYPE, lowercase
             utf-8. Both are case-insensitive to a browser, but the checkers match the literal. -->
        <meta charset="utf-8" />
        <!-- The zoom locks are the networks' recommended string. An ad slot is a fixed frame the
             player can't scroll out of, and a pinch that scales the canvas can't be undone. -->
        <meta
            name="viewport"
            content="width=device-width,user-scalable=no,initial-scale=1.0, minimum-scale=1.0,maximum-scale=1.0"
        />
        <title>Bee Cube</title>
    </head>
    <body>
        <canvas id="application-canvas"></canvas>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
